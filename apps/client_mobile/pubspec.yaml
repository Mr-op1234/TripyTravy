name: client_mobile
description: TripyTravy Mobile Read-Only Trip Viewer (Driving Adapter)
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.6
  tripytravy_core:
    path: ../../packages/tripytravy_core

dev_dependencies:
  cross_file: ^0.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
